services:
  postgres:
    image: postgres:16-alpine
    container_name: civicpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicpulse_password}
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicpulse_user} -d ${POSTGRES_DB:-civicpulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: civicpulse-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  backend:
    image: ghcr.io/hussainali-code/civicpulse/backend:${IMAGE_TAG:-latest}
    container_name: civicpulse-backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://civicpulse_user:civicpulse_password@postgres:5432/civicpulse_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-llm}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  frontend:
    image: ghcr.io/hussainali-code/civicpulse/frontend:${IMAGE_TAG:-latest}
    container_name: civicpulse-frontend
    ports:
      - "80:80"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
