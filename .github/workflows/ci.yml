name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions: {}

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python linting tools
        run: pip install ruff mypy && pip install -e "backend/[dev]"

      - name: Run Ruff linter on backend
        working-directory: backend
        run: ruff check .

      - name: Run Mypy type checker on backend
        working-directory: backend
        run: mypy app/

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run ESLint on frontend
        run: cd frontend && npm run lint

      - name: Run TypeScript type checker on frontend
        run: cd frontend && npx tsc --noEmit

  test-backend:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: civicpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/civicpulse_test
      REDIS_URL: redis://localhost:6379/0
      TRIAGE_PROVIDER: simulated
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend and test dependencies
        run: pip install -e "backend/[dev]"

      - name: Run database migrations with Alembic
        working-directory: backend
        run: alembic upgrade head

      - name: Run Pytest with strict coverage check (>=65%)
        working-directory: backend
        run: pytest --cov-fail-under=65 --cov-report=xml --cov-report=term-missing

  test-frontend:
    name: Frontend Component Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run Vitest component tests
        run: cd frontend && npm test -- --reporter=verbose

  build:
    name: Docker Build (No Push)
    needs: [lint-and-type, test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build backend/ -t civicpulse-backend:ci

      - name: Build frontend Docker image
        run: docker build frontend/ -t civicpulse-frontend:ci

      - name: Save container images as artifacts
        run: |
          docker save civicpulse-backend:ci | gzip > backend-image.tar.gz
          docker save civicpulse-frontend:ci | gzip > frontend-image.tar.gz

      - name: Upload image artifacts for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: ci-images
          path: '*.tar.gz'
          retention-days: 1

  scan:
    name: Trivy Security Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download container images
        uses: actions/download-artifact@v4
        with:
          name: ci-images

      - name: Load Docker images into daemon
        run: |
          docker load < backend-image.tar.gz
          docker load < frontend-image.tar.gz

      - name: Run Trivy vulnerability scan on backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civicpulse-backend:ci
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy vulnerability scan on frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civicpulse-frontend:ci
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  manifests:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kustomize & Kubeconform
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo install -o root -g root -m 0755 kustomize /usr/local/bin/kustomize
          curl -L "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo install -o root -g root -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Validate Production Kustomize manifests with Kubeconform
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas

  integration:
    name: Docker Compose Integration Test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download container images
        uses: actions/download-artifact@v4
        with:
          name: ci-images

      - name: Load Docker images into daemon
        run: |
          docker load < backend-image.tar.gz
          docker load < frontend-image.tar.gz

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Start services with Docker Compose (using pre-built CI images)
        run: |
          # Use compose.ci.override.yaml to swap build: for pre-built :ci images
          docker compose -f compose.yaml -f compose.ci.override.yaml up -d postgres redis
          sleep 10
          docker compose -f compose.yaml -f compose.ci.override.yaml up -d backend

      - name: Run Alembic migrations inside backend container
        run: |
          echo "Waiting for backend container to be running..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Status}}' civicpulse-backend 2>/dev/null || echo "missing")
            if [ "$STATUS" = "running" ]; then
              echo "Backend container is running"
              break
            fi
            echo "Waiting ($i/30): status=$STATUS"
            sleep 2
          done
          # alembic.ini is at WORKDIR /app inside the container
          docker exec civicpulse-backend alembic -c /app/alembic.ini upgrade head

      - name: Wait for backend readiness probe (/ready)
        run: |
          echo "Awaiting backend readiness on http://localhost:8000/ready..."
          SUCCESS=false
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/ready; then
              echo "Backend is ready!"
              SUCCESS=true
              break
            fi
            echo "Waiting for backend ($i/45)..."
            sleep 2
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "Backend never became ready — dumping logs:"
            docker compose -f compose.yaml -f compose.ci.override.yaml logs backend
            exit 1
          fi


      - name: POST complaint and verify category triage
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text":"Pani ki pipe phat gayi is street mein","location":"Street 12"}')
          echo "Create Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'category' in d; assert 'id' in d"
          CID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "COMPLAINT_ID=$CID" >> $GITHUB_ENV

      - name: GET complaint by ID and verify category
        run: |
          curl -sf "http://localhost:8000/api/complaints/$COMPLAINT_ID" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['category'] in ['water','electricity','sanitation','roads','streetlights','other']"

      - name: Verify Redis Stats Caching (X-Cache MISS then HIT)
        run: |
          CACHE1=$(curl -si http://localhost:8000/api/stats | grep -i x-cache | tr -d '\r')
          echo "First /api/stats call: $CACHE1"
          echo "$CACHE1" | grep -i "MISS" || (echo "Expected MISS, got: $CACHE1" && exit 1)

          CACHE2=$(curl -si http://localhost:8000/api/stats | grep -i x-cache | tr -d '\r')
          echo "Second /api/stats call: $CACHE2"
          echo "$CACHE2" | grep -i "HIT" || (echo "Expected HIT, got: $CACHE2" && exit 1)

      - name: Tear down Docker Compose environment
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.override.yaml down -v

