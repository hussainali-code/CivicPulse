apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-config
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: civicpulse-config
    app.kubernetes.io/part-of: civicpulse
data:
  APP_ENV: "production"
  PORT: "8000"
  POSTGRES_DB: "civicpulse_db"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://redis:6379/0"
  DATABASE_URL: "postgresql+asyncpg://civicpulse_user:civicpulse_password@postgres:5432/civicpulse_db"
  TRIAGE_PROVIDER: "simulated"
  ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://civicpulse.local"
  LLM_MODEL: "llama-3.3-70b-versatile"
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
