apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse

resources:
  - ../../base

namePrefix: dev-

patches:
  # Reduce replicas in development to conserve cluster resources
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Configure development environment settings
  - target:
      kind: ConfigMap
      name: civicpulse-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: "development"
      - op: replace
        path: /data/TRIAGE_PROVIDER
        value: "simulated"
