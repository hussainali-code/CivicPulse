[project]
name = "civicpulse-backend"
version = "0.1.0"
description = "CivicPulse FastAPI Backend Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy>=2.0.35,<2.1.0",
    "asyncpg>=0.30.0,<0.32.0",
    "alembic>=1.13.3,<1.14.0",
    "pydantic>=2.9.2,<2.10.0",
    "pydantic-settings>=2.5.2,<2.6.0",
    "redis>=5.1.1,<5.2.0",
    "prometheus-client>=0.21.0,<0.22.0",
    "httpx>=0.27.2,<0.28.0",
    "openai>=1.51.0,<1.52.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<8.4.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=5.0.0,<5.1.0",
    "ruff>=0.6.9,<0.7.0",
    "mypy>=1.11.2,<1.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
